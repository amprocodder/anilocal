name: Build and verify APKs

on:
  push:
    branches: [ "**" ]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  commit-messages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit messages (rules in CLAUDE.md)
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          # Check every commit in this push; a new branch or manual run checks just the head commit.
          if git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            commits=$(git rev-list --no-merges "$BEFORE..$AFTER")
          else
            commits=$(git rev-list --no-merges -1 "$AFTER")
          fi
          fail=0
          for c in $commits; do
            git log -1 --format=%B "$c" > "$RUNNER_TEMP/msg"
            .github/hooks/commit-msg "$RUNNER_TEMP/msg" || { echo "  in commit $c"; fail=1; }
          done
          exit $fail

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Check modules and lint
        run: >-
          gradle :domain:check :extensions:lintDebug :data:lintDebug
          :app:lintDebug --no-daemon --stacktrace

      - name: Assemble development and performance APKs
        run: gradle :app:assembleDebug :app:assembleBenchmark --no-daemon --stacktrace

      - name: Upload development APK
        uses: actions/upload-artifact@v4
        with:
          name: anilocal-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload performance APK
        uses: actions/upload-artifact@v4
        with:
          name: anilocal-optimized-apk
          path: app/build/outputs/apk/benchmark/*.apk
          if-no-files-found: error
