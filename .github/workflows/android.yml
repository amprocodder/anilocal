name: Build debug APK

# Builds an installable debug APK on every push and exposes it as a downloadable
# artifact. Download it on the tablet's browser and sideload it — no on-device toolchain.
on:
  push:
    branches: [ "**" ]
  workflow_dispatch: {}        # lets you trigger a build manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: anilocal-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
