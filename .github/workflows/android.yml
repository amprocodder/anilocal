name: Build and verify APKs

on:
  push:
    branches: [ "**" ]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run JVM tests and lint
        run: >-
          gradle :domain:test :data:testDebugUnitTest :app:testDebugUnitTest
          :data:lintDebug :app:lintDebug --no-daemon --stacktrace

      - name: Assemble development and optimized APKs
        run: gradle :app:assembleDebug :app:assembleBenchmark --no-daemon --stacktrace

      - name: Upload development APK
        uses: actions/upload-artifact@v4
        with:
          name: anilocal-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload optimized APK
        uses: actions/upload-artifact@v4
        with:
          name: anilocal-optimized-apk
          path: app/build/outputs/apk/benchmark/*.apk
          if-no-files-found: error
