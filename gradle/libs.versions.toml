[versions]
agp = "9.5.2"
kotlin = "2.4.21"
ksp = "2.3.14"
core = "1.19.1"
lifecycle = "2.11.1"
activityCompose = "1.13.0"
composeBom = "2026.11.01"
navigation = "2.10.2"
room = "2.8.5"
datastore = "1.3.0"
# OkHttp 5 app-wide: the vendored Aniyomi source-api/network stack (:extensions) is written
# against it, and loaded extensions link against the host's copy at runtime — keep it at or above
# what extensions are built with (yuzono anime-extensions: 5.3.2 as of 2026-11).
okhttp = "5.5.1"
coil = "2.7.0"
media3 = "1.11.1"
coroutines = "1.11.0"

# Vendored Aniyomi source-api runtime deps (:extensions only). Extensions call these at runtime, so
# keep each at or above the version extensions compile against (latest stable as of 2026-11).
rxjava = "1.3.8"
okio = "3.18.2"
jsoup = "1.24.1"
injekt = "91edab2317"          # com.github.mihonapp:injekt JitPack commit
serialization = "1.13.0"
preference = "1.2.1"
quickjs = "0.9.2"            # final release of app.cash.quickjs; Aniyomi provides the same

[libraries]
androidx-core = { group = "androidx.core", name = "core", version.ref = "core" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }

compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }


room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }

coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }

media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-exoplayer-hls = { group = "androidx.media3", name = "media3-exoplayer-hls", version.ref = "media3" }
media3-exoplayer-dash = { group = "androidx.media3", name = "media3-exoplayer-dash", version.ref = "media3" }
media3-exoplayer-smoothstreaming = { group = "androidx.media3", name = "media3-exoplayer-smoothstreaming", version.ref = "media3" }
media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }

coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }

# Vendored Aniyomi source-api runtime deps (:extensions only)
rxjava = { group = "io.reactivex", name = "rxjava", version.ref = "rxjava" }
okio = { group = "com.squareup.okio", name = "okio", version.ref = "okio" }
jsoup = { group = "org.jsoup", name = "jsoup", version.ref = "jsoup" }
injekt-core = { group = "com.github.mihonapp", name = "injekt", version.ref = "injekt" }
kotlinx-serialization-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-core", version.ref = "serialization" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-serialization-jsonOkio = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json-okio", version.ref = "serialization" }
kotlinx-serialization-protobuf = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-protobuf", version.ref = "serialization" }
androidx-preference = { group = "androidx.preference", name = "preference-ktx", version.ref = "preference" }
quickjs-android = { group = "app.cash.quickjs", name = "quickjs-android", version.ref = "quickjs" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
